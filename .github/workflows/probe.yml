name: Probe CAMPHUB access
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          UA_PROJECT="Mozilla/5.0 (compatible; SeedStackStudentProject/1.0; +https://campalert-puri-z.vercel.app)"
          UA_CHROME="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36"

          echo "== 1. current UA =="
          curl -s -o /dev/null -w "%{http_code}\n" -A "$UA_PROJECT" -H "accept: text/html" https://www.camphub.in.th/

          echo "== 2. chrome UA full headers =="
          curl -s -o /dev/null -w "%{http_code}\n" \
            -A "$UA_CHROME" \
            -H "accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
            -H "accept-language: th,en-US;q=0.9,en;q=0.8" \
            -H "sec-ch-ua: \"Chromium\";v=\"137\", \"Not/A)Brand\";v=\"24\"" \
            -H "sec-ch-ua-mobile: ?0" \
            -H "sec-ch-ua-platform: \"Windows\"" \
            -H "sec-fetch-dest: document" \
            -H "sec-fetch-mode: navigate" \
            -H "sec-fetch-site: none" \
            -H "sec-fetch-user: ?1" \
            -H "upgrade-insecure-requests: 1" \
            https://www.camphub.in.th/

          echo "== 3. empty UA =="
          curl -s -o /dev/null -w "%{http_code}\n" -H "User-Agent:" https://www.camphub.in.th/

          echo "== 4. node fetch current headers =="
          node -e '
            fetch("https://www.camphub.in.th/", { headers: { "user-agent": "Mozilla/5.0 (compatible; SeedStackStudentProject/1.0; +https://campalert-puri-z.vercel.app)", accept: "text/html" } })
              .then((r) => console.log(r.status, r.headers.get("server"), r.headers.get("cf-mitigated")))
              .catch((e) => console.log("error", e.message));
          '

          echo "== 5. node fetch chrome UA =="
          node -e '
            fetch("https://www.camphub.in.th/", { headers: { "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36", accept: "text/html,application/xhtml+xml", "accept-language": "th,en;q=0.9" } })
              .then((r) => console.log(r.status, r.headers.get("server"), r.headers.get("cf-mitigated")))
              .catch((e) => console.log("error", e.message));
          '

          echo "== body preview of 403 =="
          curl -s -A "$UA_CHROME" https://www.camphub.in.th/ | head -c 600
