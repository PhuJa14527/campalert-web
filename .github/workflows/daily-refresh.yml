name: Daily CAMPHUB refresh

# ทำไมต้องมี workflow นี้
# เว็บถูก build จากไฟล์ data/camps.json ถ้าข้อมูลไม่อัปเดต หน้าเว็บก็จะค้างที่รอบเดิม
# เดิมงานนี้รันบนคอมเจ้าของโปรเจกต์ผ่าน Windows Task Scheduler ซึ่งต้องเปิดคอมไว้
# ย้ายมารันบนเครื่อง GitHub แทน คอมจะปิดหรือไม่ปิดข้อมูลก็รีเฟรชทุกวัน
#
# ขั้นตอน: ดึงข้อมูล -> commit data/camps.json -> push กลับมาที่ branch master
# แล้ว Vercel (ที่ผูก Git ไว้แล้ว) จะ build และ deploy ให้อัตโนมัติจากการ push นี้

on:
  schedule:
    # GitHub Actions ใช้เวลา UTC, 06:30 น. เวลาไทย = 23:30 UTC ของวันก่อนหน้า
    - cron: "30 23 * * *"
  # กดรันเองได้จากแท็บ Actions เวลาอยากรีเฟรชเดี๋ยวนั้น
  workflow_dispatch:

# ต้องมีสิทธิ์เขียน repo เพื่อ commit ไฟล์ข้อมูลกลับเข้าไป
permissions:
  contents: write

# กันรันซ้อนกัน ถ้ากดรันเองตอนที่รอบตั้งเวลายังทำงานอยู่
concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ต้องเอามาเต็มประวัติ เพราะขั้น commit ใช้ git pull --rebase
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # สคริปต์ใช้ fetch ที่มีมาใน Node อยู่แล้ว จึงไม่ต้อง npm ci
      # (ไม่ต้องติดตั้ง dependencies ให้เสียเวลา)
      - name: Fetch CAMPHUB
        id: fetch
        run: |
          set +e
          node scripts/fetch-camphub.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            # exit 2 = ตัวกันข้อมูลแย่ทับของดีทำงาน (ได้ค่ายน้อยกว่ารอบก่อนเกิน 30%)
            # ไม่ใช่ความผิดพลาดร้ายแรง แค่ข้ามรอบนี้ไป
            echo "ตัวกันข้อมูลแย่ทำงาน ข้ามการ commit รอบนี้"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            echo "ดึงข้อมูลล้มเหลว (exit $code)"
            exit "$code"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.fetch.outputs.changed == 'true'
        run: |
          if git diff --quiet -- data/camps.json; then
            echo "ข้อมูลเท่าเดิม ไม่ต้อง commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/camps.json
          git commit -m "รีเฟรชข้อมูล CAMPHUB อัตโนมัติ $(date -u +'%Y-%m-%d')"

          # ถ้าระหว่างนั้นมี commit ใหม่จากเครื่องเรา ให้ rebase ต่อท้ายแล้วค่อย push
          git pull --rebase origin master
          git push origin master

      - name: Summary
        if: always()
        run: |
          node -e '
            const data = require("./data/camps.json");
            const noDate = data.camps.filter((c) => !c.startDate).length;
            console.log(`ค่ายทั้งหมด ${data.camps.length} ค่าย (ไม่มีวันจัด ${noDate})`);
            console.log(`ดึงข้อมูลเมื่อ ${data.fetchedAt}`);
          ' >> "$GITHUB_STEP_SUMMARY" 2>&1 || echo "อ่าน data/camps.json ไม่ได้" >> "$GITHUB_STEP_SUMMARY"
